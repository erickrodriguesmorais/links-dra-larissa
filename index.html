
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dra. Larissa Lima | Links oficiais</title>
  <meta
    name="description"
    content="Acesse os canais oficiais da Dra. Larissa Lima e agende seu atendimento médico."
  >

  <link rel="canonical" href="https://links.dralarissalimaa.com.br/">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GS2WJ54Y5F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-GS2WJ54Y5F');

    // Registrar parâmetros UTM da página de entrada.
    (function () {
      const params = new URLSearchParams(window.location.search);

      const source = params.get('utm_source');
      const medium = params.get('utm_medium');
      const campaign = params.get('utm_campaign');

      if (!source && !medium && !campaign) return;

      // Evita duplicar o evento na mesma aba para a mesma campanha.
      const eventKey = 'utm_landing_' + [
        source || '',
        medium || '',
        campaign || ''
      ].join('_');

      try {
        if (sessionStorage.getItem(eventKey)) return;

        sessionStorage.setItem(eventKey, 'sent');
      } catch (e) {
        // Se o armazenamento estiver bloqueado, ainda envia o evento.
      }

      gtag('event', 'utm_landing', {
        utm_source: source || '(not set)',
        utm_medium: medium || '(not set)',
        utm_campaign: campaign || '(not set)',
        page_location: window.location.href
      });
    })();

    // Medir cliques em links de WhatsApp.
    document.addEventListener('click', function (event) {
      const link = event.target.closest('a');

      if (!link || !link.href) return;

      if (link.href.includes('wa.me') ||
          link.href.includes('api.whatsapp.com')) {
        gtag('event', 'clique_whatsapp', {
          link_url: link.href,
          link_text: (link.innerText || '').trim()
        });
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;

      color: #49382d;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }

    .card {
      padding: 30px 22px;
      border: 1px solid #e9dfd5;
      border-radius: 22px;
      background: #fffdfa;
      box-shadow: 0 8px 28px rgba(73, 56, 45, 0.06);
    }

    .avatar {
      display: flex;
      width: 94px;
      height: 94px;
      margin: 0 auto 18px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #80634f;
      color: white;
      font-size: 30px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      margin: 10px 0 24px;

      font-size: 14px;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 15px 18px;
      border: 1px solid #e9dfd5;
      border-radius: 13px;
      background: #fff;
      color: #624b3b;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .links a.primary {
      border-color: #80634f;
      background: #80634f;
      color: white;
    }

    .links a:hover {
      transform: translateY(-1px);
      background: #f5eee6;
    }

    .links a.primary:hover {
      background: #694e3d;
    }

    footer {
      margin-top: 22px;
      color: #96877b;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

        Clínica Médica<br>

      </p>

      <nav class="links" aria-label="Links oficiais">
