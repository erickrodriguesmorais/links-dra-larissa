
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GS2WJ54Y5F"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());
  gtag('config', 'G-GS2WJ54Y5F');

  // Registra a campanha UTM quando a página é aberta com parâmetros.
  (function () {
    const params = new URLSearchParams(window.location.search);

    const source = params.get('utm_source');
    const medium = params.get('utm_medium');
    const campaign = params.get('utm_campaign');

    if (!source && !medium && !campaign) return;

    const storageKey = 'utm_landing_' + [
      source || '',
      medium || '',
      campaign || ''
    ].join('_');

    try {
      if (sessionStorage.getItem(storageKey)) return;
      sessionStorage.setItem(storageKey, 'sent');
    } catch (error) {
      // O rastreamento continua mesmo se o armazenamento estiver bloqueado.
    }

    gtag('event', 'utm_landing', {
      utm_source: source || '(not set)',
      utm_medium: medium || '(not set)',
      utm_campaign: campaign || '(not set)',
      page_location: window.location.href
    });
  })();
</script>
