
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dra. Larissa Lima | Clínica Médica</title>
  <meta
    name="description"
    content="Acesse os canais de atendimento da Dra. Larissa Lima e agende sua consulta médica."
  >
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#80634f">

  <link rel="canonical" href="https://links.dralarissalimaa.com.br/">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GS2WJ54Y5F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-GS2WJ54Y5F');

    /*
      Registra os parâmetros UTM em um evento separado.
      Não substitui a atribuição padrão de sessão do GA4.
    */
    (function () {
      const params = new URLSearchParams(window.location.search);

      const source = params.get('utm_source');
      const medium = params.get('utm_medium');
      const campaign = params.get('utm_campaign');

      if (!source && !medium && !campaign) return;

      const eventKey = 'utm_landing_sent_' + [
        source || '',
        medium || '',
        campaign || ''
      ].join('_');

      try {
        if (sessionStorage.getItem(eventKey)) return;
        sessionStorage.setItem(eventKey, '1');
      } catch (e) {
        // O evento ainda pode ser enviado se sessionStorage estiver bloqueado.
      }

      gtag('event', 'utm_landing', {
        utm_source: source || '(not set)',
        utm_medium: medium || '(not set)',
        utm_campaign: campaign || '(not set)',
        page_location: window.location.href
      });
    })();
  </script>

  <style>
    :root {
      --brown: #80634f;
      --brown-dark: #604735;
      --cream: #f8f5f1;
      --white: #fffdfa;
      --text: #49382d;
      --muted: #88796d;
      --border: #e9dfd5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: var(--cream);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .profile {
      padding: 30px 22px 24px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 8px 30px rgba(73, 56, 45, 0.05);
    }

    .monogram {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--brown);
      color: white;
      font-family: Georgia, serif;
      font-size: 29px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: 500;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .crm {
      margin: 12px 0 0;
      color: var(--brown);
      font-size: 12px;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .link {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: white;
      color: var(--brown-dark);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      background: #f4ece4;
    }

    .link.primary {
      border-color: var(--brown);
      background: var(--brown);
      color: white;
    }

    .link.primary:hover {
      background: var(--brown-dark);
    }

    footer {
      padding: 22px 10px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      body {
        padding: 18px 12px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="profile">
      <div class="monogram" aria-hidden="true">LL</div>

      <h1>Dra. Larissa Lima</h1>

      <p class="subtitle">
        Clínica Médica<br>
        Cuidado individualizado para sua saúde.
      </p>

      <p class="crm">
        Médica · Consulte o registro profissional nos canais oficiais
      </p>

      <nav class="links" aria-label="Canais de atendimento">
        <a
          class="link primary"
          href="https://wa.me/5583998023806"
          target="_blank"
          rel="noopener noreferrer"
          data-link-name="whatsapp"
        >
          Agendar consulta pelo WhatsApp
        </a>

        <a
          class="link"
          href="https://www.instagram.com/dralarissalima/"
          target="_blank"
          rel="noopener noreferrer"
          data-link-name="instagram"
        >
          Instagram
        </a>

        <a
          class="link"
          href="https://www.dralarissalimaa.com.br"
          target="_blank"
          rel="noopener noreferrer"
          data-link-name="website"
        >
          Site oficial
        </a>
      </nav>
    </section>

    <footer>
      Dra. Larissa Lima · Clínica Médica<br>
      As informações desta página não substituem uma consulta médica.
    </footer>
  </main>

  <script>
    /*
      Registra cliques nos links para análise.
      O evento de clique não confirma que uma consulta foi agendada.
    */
    document.querySelectorAll('[data-link-name]').forEach(function (link) {
      link.addEventListener('click', function () {
        if (typeof window.gtag !== 'function') return;

        window.gtag('event', 'link_click', {
          link_name: link.dataset.linkName,
          link_url: link.href
        });

        if (link.dataset.linkName === 'whatsapp') {
          window.gtag('event', 'agendar_consulta', {
            link_url: link.href,
            link_name: 'whatsapp'
          });
        }
      });
    });
  </script>
</body>
</html>
